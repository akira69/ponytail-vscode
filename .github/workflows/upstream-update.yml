name: Upstream update
on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      tag: ${{ steps.upstream.outputs.tag }}
      base: ${{ steps.upstream.outputs.base }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Resolve upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api repos/DietrichGebert/ponytail/releases/latest --jq .tag_name)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          source="$RUNNER_TEMP/ponytail-upstream"
          git clone --filter=blob:none --no-checkout https://github.com/DietrichGebert/ponytail.git "$source"
          git -C "$source" fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          commit="$(git -C "$source" rev-parse "$tag^{commit}")"
          git -C "$source" checkout --detach "$commit"
          printf 'tag=%s\ncommit=%s\nsource=%s\n' "$tag" "$commit" "$source" >> "$GITHUB_OUTPUT"
          printf 'base=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Import allow-listed upstream assets
        env:
          SOURCE: ${{ steps.upstream.outputs.source }}
          TAG: ${{ steps.upstream.outputs.tag }}
          COMMIT: ${{ steps.upstream.outputs.commit }}
        run: node scripts/sync-upstream.cjs --source "$SOURCE" --release "$TAG" --commit "$COMMIT"
      - name: Detect a changed pin
        id: changes
        run: |
          if git diff --quiet -- upstream.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm ci
      - name: Prepare skills
        if: steps.changes.outputs.changed == 'true'
        run: npm run prepare:skills
      - name: Generate instructions
        if: steps.changes.outputs.changed == 'true'
        run: npm run generate:instructions
      - name: Check upstream pin
        if: steps.changes.outputs.changed == 'true'
        run: npm run check:upstream
      - name: Check plugin
        if: steps.changes.outputs.changed == 'true'
        run: npm run check:plugin
      - name: Lint and audit
        if: steps.changes.outputs.changed == 'true'
        run: npm run lint && npm audit --audit-level=moderate
      - name: Test
        if: steps.changes.outputs.changed == 'true'
        run: xvfb-run -a npm test
      - name: Package
        if: steps.changes.outputs.changed == 'true'
        run: npm run package
      - name: Save validated changes
        if: steps.changes.outputs.changed == 'true'
        run: git diff --binary -- upstream.json upstream UPSTREAM-README.md LICENSE skills hooks generated/instructions > upstream-update.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.changes.outputs.changed == 'true'
        with:
          name: upstream-update
          path: upstream-update.patch
          if-no-files-found: error

  propose:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.update.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upstream-update
          path: ${{ runner.temp }}/upstream-update
      - name: Apply only the imported asset paths
        run: |
          git apply --index --include=upstream.json --include='upstream/*' --include=UPSTREAM-README.md --include=LICENSE --include='skills/*' --include='hooks/*' --include='generated/instructions/*' -- "$RUNNER_TEMP/upstream-update/upstream-update.patch"
      - name: Open review pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.update.outputs.tag }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if git diff --cached --quiet; then exit 0; fi
          branch="upstream/$TAG"
          gh auth setup-git
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Open pull request #$existing already covers $TAG; nothing to do."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -m "chore: update Ponytail assets to $TAG"
          remote="$(git ls-remote --heads origin "$branch")"
          if [ -n "$remote" ]; then
            git fetch origin "$branch"
            git diff --exit-code HEAD FETCH_HEAD
          else
            git push origin "HEAD:refs/heads/$branch"
          fi
          body="Updates the pinned Ponytail assets. Validation ran in the update workflow before this PR was opened. A pull request created with GITHUB_TOKEN does not trigger pull_request or push workflows, so close and reopen this PR to run CI. A maintainer must review before merge or release."
          printf '%s\n' "$body" > "$RUNNER_TEMP/upstream-pr-body.md"
          gh pr create --draft --base "$BASE" --head "$branch" --title "chore: update Ponytail assets to $TAG" --body-file "$RUNNER_TEMP/upstream-pr-body.md"
